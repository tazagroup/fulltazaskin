<mat-drawer-container class="example-container w-full h-full p-8" autosize>
  <mat-drawer #drawer mode="side" class="!flex flex-col flex-auto min-w-0 relative h-full w-2/3" position="end">
      <div class="relative flex flex-col h-full w-full overflow-auto">
          <!-- <router-outlet></router-outlet> -->
      </div>
  </mat-drawer>
  <mat-drawer-content class="!flex flex-col flex-auto min-w-0 relative bg-white p-4">
    <mat-form-field>
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
    </mat-form-field>
    <div class="w-full p-8">
      <table class="border w-full" mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="ID">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.ID}} </td>
        </ng-container>
        <ng-container matColumnDef="CustName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> CustName </th>
          <td mat-cell *matCellDef="let row"> {{row.CustName}} </td>
        </ng-container>
        <ng-container matColumnDef="CustPhone">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> CustPhone </th>
          <td mat-cell *matCellDef="let row"> {{row.CustPhone}} </td>
        </ng-container>
        <ng-container matColumnDef="Code">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Code </th>
          <td mat-cell *matCellDef="let row"> {{row.Code}} </td>
        </ng-container>
        <ng-container matColumnDef="Paid">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Paid </th>
          <td mat-cell *matCellDef="let row"> {{row.Paid| number:'1.0-0'}}đ </td>
        </ng-container>
        <ng-container matColumnDef="BranchID">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> BranchID </th>
          <td mat-cell *matCellDef="let row"> {{row.BranchID}} </td>
        </ng-container>
        <ng-container matColumnDef="Created">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Created </th>
          <td mat-cell *matCellDef="let row"> {{row.Created|date:'dd/MM/yyyy'}} </td>
        </ng-container>
        <ng-container matColumnDef="Status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
          <td mat-cell *matCellDef="let row"> {{row.Status}} </td>
        </ng-container>
    
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" pageSize="50" aria-label="Select page of users"></mat-paginator>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
<ng-template #dialogTemplate>
  <div class="min-w-[672px]">
  <div mat-dialog-title>Thêm Mới</div>
  <div mat-dialog-content>
      <div class="flex flex-col w-full space-y-4 p-4">
          <mat-form-field appearance="outline" class="w-full">
          <mat-label>Tiêu Đề</mat-label>
          <input matInput [(ngModel)]="Detail.Tieude" [ngModelOptions]="{standalone: true}" placeholder="Tiêu Đề">
          </mat-form-field>
          <mat-form-field appearance="outline" class="w-full">
          <mat-label>Oldlink</mat-label>
          <input matInput [(ngModel)]="Detail.Oldlink" [ngModelOptions]="{standalone: true}" placeholder="Oldlink">
          </mat-form-field>
          <mat-form-field appearance="outline" class="w-full">
          <mat-label>Newlink</mat-label>
          <input matInput [(ngModel)]="Detail.Newlink" [ngModelOptions]="{standalone: true}" placeholder="Newlink">
          </mat-form-field>
          </div>
  </div>
  <div mat-dialog-actions class="justify-center">
      <button mat-button class="bg-red-400 hover:bg-red-600 text-white" mat-dialog-close="false">Huỷ</button>
      <button mat-button class="bg-blue-400 hover:bg-blue-600 text-white" mat-dialog-close="true">Đồng Ý</button>
  </div>
</div>
</ng-template>
