function timestampToDateString(timestamp) {
  const date = new Date(timestamp);
  const year = date.getFullYear();
  const month = (date.getMonth() + 1).toString().padStart(2, '0'); // Tháng bắt đầu từ 0 nên cần cộng thêm 1
  const day = date.getDate().toString().padStart(2, '0');
  return `${year}-${month}-${day}`;
}
function addDaysToDate(startDate, numberOfDays) {
  const result = [];
  let currentDate = new Date(startDate);

  for (let i = 0; i < numberOfDays; i++) {
    result.push(new Date(currentDate));
   const date =  currentDate.setDate(currentDate.getDate() + 1);
   const formattedDate = timestampToDateString(date);
   console.log(formattedDate); // Output: 2019-01-01
    setTimeout(() => {
        Update(formattedDate)
    }, i*10000);
  }

  return result;
}
